<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mitt lederverktøy</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh;padding:2rem 1rem;}
  .container{max-width:720px;margin:0 auto;}
  h1{font-size:22px;font-weight:500;margin-bottom:4px;}
  .subtitle{font-size:13px;color:#666;margin-bottom:1.5rem;}
  .tab-bar{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap;}
  .tab{padding:8px 16px;border:1px solid #ccc;border-radius:8px;background:#fff;font-size:14px;cursor:pointer;color:#555;transition:all 0.15s;}
  .tab.active{background:#dbeafe;color:#1e40af;border-color:#93c5fd;font-weight:500;}
  .section{display:none;}
  .section.active{display:block;}
  .card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:1rem 1.25rem;margin-bottom:12px;}
  .avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:13px;flex-shrink:0;}
  .av-blue{background:#dbeafe;color:#1e3a8a;}
  .av-teal{background:#d1fae5;color:#064e3b;}
  .av-amber{background:#fef3c7;color:#78350f;}
  .av-purple{background:#ede9fe;color:#4c1d95;}
  .section-label{font-size:11px;color:#888;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em;font-weight:500;}
  .badge{font-size:11px;padding:3px 9px;border-radius:8px;display:inline-block;}
  .badge-task{background:#fef3c7;color:#78350f;}
  .badge-challenge{background:#fee2e2;color:#7f1d1d;}
  .badge-note{background:#ede9fe;color:#4c1d95;}
  .badge-done{background:#d1fae5;color:#064e3b;}
  textarea{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;color:#1a1a1a;background:#f9f9f7;resize:vertical;min-height:80px;outline:none;}
  textarea:focus{border-color:#93c5fd;}
  input[type=text]{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;color:#1a1a1a;background:#f9f9f7;outline:none;}
  input[type=text]:focus{border-color:#93c5fd;}
  select{border:1px solid #d1d5db;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;color:#1a1a1a;background:#f9f9f7;outline:none;width:100%;}
  .btn{padding:8px 14px;border:1px solid #d1d5db;border-radius:8px;background:#fff;font-size:13px;cursor:pointer;color:#1a1a1a;transition:background 0.1s;}
  .btn:hover{background:#f3f4f6;}
  .btn-primary{background:#dbeafe;color:#1e40af;border-color:#93c5fd;}
  .btn-primary:hover{background:#bfdbfe;}
  .btn-sm{padding:3px 9px;font-size:12px;border:1px solid #e5e5e5;border-radius:6px;background:#fff;cursor:pointer;color:#888;}
  .btn-sm:hover{background:#f3f4f6;}
  .person-tab-bar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .ptab{padding:6px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;cursor:pointer;color:#555;background:#fff;}
  .ptab.active{font-weight:500;}
  .ptab-blue.active{background:#dbeafe;color:#1e3a8a;border-color:#93c5fd;}
  .ptab-teal.active{background:#d1fae5;color:#064e3b;border-color:#6ee7b7;}
  .ptab-amber.active{background:#fef3c7;color:#78350f;border-color:#fcd34d;}
  .ptab-purple.active{background:#ede9fe;color:#4c1d95;border-color:#c4b5fd;}
  .item-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f0f0f0;}
  .item-row:last-child{border-bottom:none;}
  .item-row input[type=checkbox]{width:15px;height:15px;flex-shrink:0;accent-color:#2563eb;cursor:pointer;}
  .item-text{font-size:13px;color:#1a1a1a;flex:1;line-height:1.5;}
  .item-text.done{text-decoration:line-through;color:#aaa;}
  .note-item{padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13px;color:#1a1a1a;line-height:1.5;display:flex;gap:8px;align-items:flex-start;}
  .note-item:last-child{border-bottom:none;}
  .note-dot{width:6px;height:6px;border-radius:50%;background:#7c3aed;flex-shrink:0;margin-top:6px;}
  .metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem;}
  .metric{background:#fff;border-radius:8px;padding:0.75rem 1rem;border:1px solid #e5e5e5;}
  .metric-label{font-size:12px;color:#888;margin-bottom:3px;}
  .metric-val{font-size:22px;font-weight:500;color:#1a1a1a;}
  .subsection{margin-top:16px;padding-top:14px;border-top:1px solid #f0f0f0;}
  .add-row{display:flex;gap:8px;margin-top:8px;}
  .add-row input{flex:1;}
  .empty{font-size:13px;color:#aaa;padding:6px 0;}
  .sync-bar{display:flex;align-items:center;gap:8px;font-size:12px;color:#888;margin-bottom:1rem;}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:#d1fae5;border:1px solid #6ee7b7;}
  .sync-dot.syncing{background:#fef3c7;border-color:#fcd34d;}
  .sync-dot.error{background:#fee2e2;border-color:#fca5a5;}
  @media(max-width:500px){.metric-row{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>
<div class="container">
  <h1>Mitt lederverktøy</h1>
  <p class="subtitle">Huskeliste · Oppgaver · Utfordringer · Referat</p>
  <div class="sync-bar">
    <div class="sync-dot syncing" id="sync-dot"></div>
    <span id="sync-status">Laster data...</span>
    <button class="btn-sm" onclick="syncFromSheet()" style="margin-left:auto;">Oppdater</button>
  </div>

  <div class="tab-bar">
    <button class="tab active" onclick="showTab('oversikt',this)">Oversikt</button>
    <button class="tab" onclick="showTab('person',this)">Medarbeidere</button>
    <button class="tab" onclick="showTab('referat',this)">1:1-referat</button>
  </div>

  <div id="oversikt" class="section active"></div>

  <div id="person" class="section">
    <div class="person-tab-bar" id="person-tabs"></div>
    <div id="person-content"></div>
  </div>

  <div id="referat" class="section">
    <div class="card">
      <p class="section-label">Nytt referat</p>
      <select id="ref-person" style="margin-bottom:8px;"></select>
      <textarea id="ref-text" placeholder="Hva ble diskutert? Hva ble avtalt? Hvordan hadde personen det?"></textarea>
      <button class="btn btn-primary" onclick="addReferat()" style="margin-top:8px;">Lagre referat</button>
    </div>
    <div id="referat-list"></div>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzsGhSzRp3YSkBYTGDpwhMmh7JxGHvdlSZRr8GO4xk0Bqv6yJvo95yzXkRRCL3uKi5F/exec';

const PERSONS = [
  {id:1, name:"Øyvind",  initials:"ØY", avClass:"av-blue",   ptabClass:"ptab-blue"},
  {id:2, name:"Birgitte",initials:"BI", avClass:"av-teal",   ptabClass:"ptab-teal"},
  {id:3, name:"Kristian",initials:"KR", avClass:"av-amber",  ptabClass:"ptab-amber"},
  {id:4, name:"Anders",  initials:"AN", avClass:"av-purple", ptabClass:"ptab-purple"}
];

let tasks=[], challenges=[], notes=[], referater=[];
let activePerson = PERSONS[0].id;

function today(){return new Date().toLocaleDateString('no-NO',{day:'2-digit',month:'2-digit',year:'numeric'});}
function uid(){return Date.now()+Math.random().toString(36).slice(2);}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function setSyncStatus(state, msg){
  const dot = document.getElementById('sync-dot');
  const status = document.getElementById('sync-status');
  dot.className = 'sync-dot ' + state;
  status.textContent = msg;
}

async function syncFromSheet(){
  setSyncStatus('syncing','Henter data...');
  try {
    const res = await fetch(API);
    const rows = await res.json();
    tasks = rows.filter(r=>r.type==='task').map(r=>({id:r.text.split('||')[0], pid:parseInt(r.pid), text:r.text.split('||')[1]||r.text, done:r.done==='true'||r.done===true}));
    challenges = rows.filter(r=>r.type==='challenge').map(r=>({id:r.text.split('||')[0], pid:parseInt(r.pid), text:r.text.split('||')[1]||r.text, done:r.done==='true'||r.done===true}));
    notes = rows.filter(r=>r.type==='note').map(r=>({id:r.text.split('||')[0], pid:parseInt(r.pid), text:r.text.split('||')[1]||r.text, date:r.date}));
    referater = rows.filter(r=>r.type==='ref').map(r=>({id:r.text.split('||')[0], pid:parseInt(r.pid), text:r.text.split('||')[1]||r.text, date:r.date}));
    setSyncStatus('','Synkronisert '+today());
    renderAll();
  } catch(e){
    setSyncStatus('error','Feil ved henting');
  }
}

async function saveToSheet(){
  setSyncStatus('syncing','Lagrer...');
  const rows = [
    ...tasks.map(t=>({type:'task', pid:t.pid, text:t.id+'||'+t.text, date:'', done:t.done})),
    ...challenges.map(c=>({type:'challenge', pid:c.pid, text:c.id+'||'+c.text, date:'', done:c.done})),
    ...notes.map(n=>({type:'note', pid:n.pid, text:n.id+'||'+n.text, date:n.date, done:false})),
    ...referater.map(r=>({type:'ref', pid:r.pid, text:r.id+'||'+r.text, date:r.date, done:false}))
  ];
  try {
    await fetch(API, {method:'POST', body:JSON.stringify({action:'replace', rows})});
    setSyncStatus('','Lagret '+today());
  } catch(e){
    setSyncStatus('error','Feil ved lagring');
  }
}

function renderAll(){
  renderOversikt();
  renderPersonTabs();
  renderPersonContent();
  populateRefSelect();
  renderReferat();
}

function showTab(id,btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  if(id==='oversikt')renderOversikt();
  if(id==='person'){renderPersonTabs();renderPersonContent();}
  if(id==='referat'){populateRefSelect();renderReferat();}
}

function renderOversikt(){
  const el=document.getElementById('oversikt');
  const openTasks=tasks.filter(t=>!t.done).length;
  const openChallenges=challenges.filter(c=>!c.done).length;
  el.innerHTML=`
    <div class="metric-row">
      <div class="metric"><div class="metric-label">Åpne oppgaver</div><div class="metric-val">${openTasks}</div></div>
      <div class="metric"><div class="metric-label">Utfordringer</div><div class="metric-val">${openChallenges}</div></div>
      <div class="metric"><div class="metric-label">Huskenotater</div><div class="metric-val">${notes.length}</div></div>
      <div class="metric"><div class="metric-label">Referater</div><div class="metric-val">${referater.length}</div></div>
    </div>
    <p class="section-label" style="margin-bottom:8px;">Per medarbeider</p>
    ${PERSONS.map(p=>{
      const pt=tasks.filter(t=>t.pid===p.id&&!t.done).length;
      const pc=challenges.filter(c=>c.pid===p.id&&!c.done).length;
      const pn=notes.filter(n=>n.pid===p.id).length;
      const pr=referater.filter(r=>r.pid===p.id);
      const last=pr.length?pr[pr.length-1].date:'Ingen';
      return `<div class="card" style="display:flex;align-items:center;gap:12px;">
        <div class="avatar ${p.avClass}">${p.initials}</div>
        <div style="flex:1;">
          <div style="font-weight:500;font-size:14px;">${p.name}</div>
          <div style="font-size:12px;color:#888;">Siste referat: ${last}</div>
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;">
          ${pn>0?`<span class="badge badge-note">${pn} husk</span>`:''}
          ${pt>0?`<span class="badge badge-task">${pt} oppg.</span>`:''}
          ${pc>0?`<span class="badge badge-challenge">${pc} utf.</span>`:''}
          ${pt===0&&pc===0&&pn===0?`<span class="badge badge-done">Alt OK</span>`:''}
        </div>
      </div>`;
    }).join('')}`;
}

function renderPersonTabs(){
  document.getElementById('person-tabs').innerHTML=PERSONS.map(p=>
    `<button class="ptab ${p.ptabClass} ${p.id===activePerson?'active':''}" onclick="switchPerson(${p.id})">${p.name}</button>`
  ).join('');
}

function switchPerson(id){activePerson=id;renderPersonTabs();renderPersonContent();}

function renderPersonContent(){
  const p=PERSONS.find(x=>x.id===activePerson);
  const pt=tasks.filter(t=>t.pid===p.id);
  const pc=challenges.filter(c=>c.pid===p.id);
  const pn=notes.filter(n=>n.pid===p.id);
  document.getElementById('person-content').innerHTML=`<div class="card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
      <div class="avatar ${p.avClass}">${p.initials}</div>
      <span style="font-weight:500;font-size:16px;">${p.name}</span>
    </div>

    <p class="section-label">Huskeliste</p>
    <p style="font-size:12px;color:#888;margin-bottom:8px;">Ting du kommer på mellom møtene</p>
    <div>
      ${pn.length===0?`<p class="empty">Ingen notater ennå.</p>`:''}
      ${pn.map(n=>`<div class="note-item">
        <div class="note-dot"></div>
        <span style="flex:1;">${escHtml(n.text)}<span style="font-size:11px;color:#aaa;margin-left:8px;">${n.date}</span></span>
        <button class="btn-sm" onclick="deleteNote('${n.id}')">×</button>
      </div>`).join('')}
    </div>
    <div class="add-row">
      <input type="text" id="new-note-${p.id}" placeholder="Skriv noe du vil huske til neste møte..." onkeydown="if(event.key==='Enter')addNote(${p.id})" />
      <button class="btn" onclick="addNote(${p.id})">Legg til</button>
    </div>

    <div class="subsection">
      <p class="section-label">Oppgaver</p>
      <div style="margin-bottom:8px;">
        ${pt.length===0?`<p class="empty">Ingen oppgaver.</p>`:''}
        ${pt.map(t=>`<div class="item-row">
          <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}',this.checked)" />
          <span class="item-text ${t.done?'done':''}">${escHtml(t.text)}</span>
          <button class="btn-sm" onclick="deleteTask('${t.id}')">×</button>
        </div>`).join('')}
      </div>
      <div class="add-row">
        <input type="text" id="new-task-${p.id}" placeholder="Legg til oppgave..." onkeydown="if(event.key==='Enter')addTask(${p.id})" />
        <button class="btn" onclick="addTask(${p.id})">Legg til</button>
      </div>
    </div>

    <div class="subsection">
      <p class="section-label">Utfordringer</p>
      <div style="margin-bottom:8px;">
        ${pc.length===0?`<p class="empty">Ingen utfordringer registrert.</p>`:''}
        ${pc.map(c=>`<div class="item-row">
          <input type="checkbox" ${c.done?'checked':''} onchange="toggleChallenge('${c.id}',this.checked)" />
          <span class="item-text ${c.done?'done':''}">${escHtml(c.text)}</span>
          <button class="btn-sm" onclick="deleteChallenge('${c.id}')">×</button>
        </div>`).join('')}
      </div>
      <div class="add-row">
        <input type="text" id="new-challenge-${p.id}" placeholder="Beskriv utfordring..." onkeydown="if(event.key==='Enter')addChallenge(${p.id})" />
        <button class="btn" onclick="addChallenge(${p.id})">Legg til</button>
      </div>
    </div>
  </div>`;
}

function addNote(pid){
  const inp=document.getElementById('new-note-'+pid);
  const text=inp.value.trim();if(!text)return;
  notes.push({id:uid(),pid,text,date:today()});
  inp.value='';saveToSheet();renderPersonContent();renderOversikt();
}
function deleteNote(id){notes=notes.filter(n=>n.id!==id);saveToSheet();renderPersonContent();renderOversikt();}

function addTask(pid){
  const inp=document.getElementById('new-task-'+pid);
  const text=inp.value.trim();if(!text)return;
  tasks.push({id:uid(),pid,text,done:false});
  inp.value='';saveToSheet();renderPersonContent();renderOversikt();
}
function toggleTask(id,val){const t=tasks.find(x=>x.id===id);if(t){t.done=val;saveToSheet();renderPersonContent();renderOversikt();}}
function deleteTask(id){tasks=tasks.filter(t=>t.id!==id);saveToSheet();renderPersonContent();renderOversikt();}

function addChallenge(pid){
  const inp=document.getElementById('new-challenge-'+pid);
  const text=inp.value.trim();if(!text)return;
  challenges.push({id:uid(),pid,text,done:false});
  inp.value='';saveToSheet();renderPersonContent();renderOversikt();
}
function toggleChallenge(id,val){const c=challenges.find(x=>x.id===id);if(c){c.done=val;saveToSheet();renderPersonContent();renderOversikt();}}
function deleteChallenge(id){challenges=challenges.filter(c=>c.id!==id);saveToSheet();renderPersonContent();renderOversikt();}

function populateRefSelect(){
  document.getElementById('ref-person').innerHTML=PERSONS.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
}

function addReferat(){
  const pid=parseInt(document.getElementById('ref-person').value);
  const text=document.getElementById('ref-text').value.trim();
  if(!text)return;
  referater.push({id:uid(),pid,text,date:today()});
  document.getElementById('ref-text').value='';
  saveToSheet();renderReferat();renderOversikt();
}

function renderReferat(){
  const el=document.getElementById('referat-list');
  if(!referater.length){el.innerHTML='';return;}
  el.innerHTML=[...referater].reverse().map(r=>{
    const p=PERSONS.find(x=>x.id===r.pid)||{name:'?',avClass:'av-blue',initials:'?'};
    return `<div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
        <div class="avatar ${p.avClass}" style="width:30px;height:30px;font-size:11px;">${p.initials}</div>
        <div style="flex:1;">
          <span style="font-weight:500;font-size:13px;">${p.name}</span>
          <span style="font-size:12px;color:#888;margin-left:8px;">${r.date}</span>
        </div>
        <button class="btn-sm" onclick="deleteRef('${r.id}')">Slett</button>
      </div>
      <p style="font-size:13px;line-height:1.6;white-space:pre-wrap;">${escHtml(r.text)}</p>
    </div>`;
  }).join('');
}

function deleteRef(id){referater=referater.filter(r=>r.id!==id);saveToSheet();renderReferat();renderOversikt();}

syncFromSheet();
</script>
</body>
</html>
